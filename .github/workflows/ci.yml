name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pendia
          POSTGRES_PASSWORD: pendia
          POSTGRES_DB: pendia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pendia -d pendia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start S3-compatible server
        # versitygw serves each directory under /data as a bucket.
        run: |
          mkdir -p "$RUNNER_TEMP/s3/pendia"
          docker run --detach --rm --publish 127.0.0.1:7070:7070 \
            --volume "$RUNNER_TEMP/s3:/data" \
            --env ROOT_ACCESS_KEY=pendia --env ROOT_SECRET_KEY=pendia-secret \
            --env VGW_BACKEND=posix --env VGW_BACKEND_ARG=/data \
            versity/versitygw:v1.8.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install media tools
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run build
      - run: bun test
        env:
          DATABASE_URL: postgresql://pendia:pendia@127.0.0.1:5432/pendia
          TEST_S3_URL: http://pendia:pendia-secret@127.0.0.1:7070/pendia

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag pendia:ci .
      - name: Record the image size and ffmpeg version
        run: |
          size="$(docker image ls pendia:ci --format '{{.Size}}')"
          ffmpeg="$(docker run --rm --entrypoint ffmpeg pendia:ci -version | head -n 1)"
          echo "Image size: $size. $ffmpeg"
          {
            echo "| Image size | ffmpeg |"
            echo "| --- | --- |"
            echo "| $size | $ffmpeg |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pushing a v1.2.3 tag publishes ghcr.io/mia-cx/pendia:1.2.3, :1.2 and :latest.
  publish:
    if: github.ref_type == 'tag'
    needs: [checks, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
