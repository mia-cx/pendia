name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pendia
          POSTGRES_PASSWORD: pendia
          POSTGRES_DB: pendia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pendia -d pendia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install media tools
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run build
      - run: bun test
        env:
          DATABASE_URL: postgresql://pendia:pendia@127.0.0.1:5432/pendia

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag pendia:ci .
