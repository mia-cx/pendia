<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)" />
    <script>
      // Restore the collapsed sidebar before first paint so its width never jumps.
      // localStorage can be blocked; the sidebar then simply starts expanded.
      try {
        if (localStorage.getItem("pendia.sidebar") === "collapsed")
          document.documentElement.dataset.sidebar = "collapsed";
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
