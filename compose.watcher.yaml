# The watcher role on the storage host, next to the disks.
# It reaches the api over HTTP and needs no database.
services:
  watcher:
    image: ghcr.io/mia-cx/pendia:${PENDIA_VERSION:-latest}
    command: ["--role", "watcher"]
    environment:
      PENDIA_API_URL: ${PENDIA_API_URL:?set the api origin, such as http://pendia.lan:3000}
      PENDIA_WATCHER_TOKEN: ${PENDIA_WATCHER_TOKEN:?set an API key with manage-libraries}
      # <library-id>=<path inside this container>, comma separated.
      PENDIA_WATCH: ${PENDIA_WATCH:?set <library-id>=/media/<folder> pairs}
    volumes:
      # The watcher only reads the media.
      - ${PENDIA_MEDIA:-/srv/media}:/media:ro
    restart: unless-stopped
