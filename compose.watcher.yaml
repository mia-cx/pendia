# The watcher role on the storage host, next to the disks.
# It reaches the api over HTTP and needs no database.
services:
  watcher:
    image: ghcr.io/mia-cx/pendia:${THALIA_VERSION:-latest}
    command: ["--role", "watcher"]
    environment:
      THALIA_API_URL: ${THALIA_API_URL:?set the api origin, such as http://thalia.lan:3000}
      THALIA_WATCHER_TOKEN: ${THALIA_WATCHER_TOKEN:?set an API key with manage-libraries}
      # <root-id>=<path inside this container>, comma separated.
      # A root id is shown on the Library page in the admin UI.
      THALIA_WATCH: ${THALIA_WATCH:?set <root-id>=/media/<folder> pairs}
    volumes:
      # The watcher only reads the media.
      - ${THALIA_MEDIA:-/srv/media}:/media:ro
    restart: unless-stopped
