services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pendia
      POSTGRES_PASSWORD: pendia
      POSTGRES_USER: pendia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username pendia --dbname pendia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  pendia:
    # Pulled from GHCR when this host can; built from this folder when it cannot.
    image: ghcr.io/mia-cx/pendia:${PENDIA_VERSION:-latest}
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pendia:pendia@postgres:5432/pendia
      # Artwork goes here when the media folder is read-only to Pendia.
      PENDIA_ARTWORK_PATH: /var/lib/pendia/artwork
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Migrations and the transcoder trial run before the first answer.
      start_period: 30s
    ports:
      # Host port; override with PENDIA_HOST_PORT when 3000 is taken.
      - "${PENDIA_HOST_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      # Your media folder, seen as /media inside the container.
      - ${PENDIA_MEDIA:-./media}:/media
      - pendia-data:/var/lib/pendia

volumes:
  postgres-data:
  pendia-data:
