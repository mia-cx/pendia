services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: thalia
      POSTGRES_PASSWORD: thalia
      POSTGRES_USER: thalia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username thalia --dbname thalia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  thalia:
    # A published release. compose.build.yaml builds this checkout instead.
    image: ghcr.io/mia-cx/thalia:${THALIA_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://thalia:thalia@postgres:5432/thalia
      # Artwork goes here when the media folder is read-only to Thalia.
      THALIA_ARTWORK_PATH: /var/lib/thalia/artwork
      # Optional; set it in .env or the shell. A key stored in Thalia wins.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Migrations and the transcoder trial run before the first answer.
      start_period: 30s
    ports:
      # Host port; override with THALIA_HOST_PORT when 3000 is taken.
      - "${THALIA_HOST_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      # Your media folder, seen as /media inside the container.
      - ${THALIA_MEDIA:-./media}:/media
      - thalia-data:/var/lib/thalia

volumes:
  postgres-data:
  thalia-data:
